<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MiCirql Export</title><style>body{font:14px system-ui;background:#111c30;color:#f4f7ff;margin:0;padding:20px;width:320px}h1{margin:0 0 4px}p{color:#b5c3df}label{display:block;margin:12px 0}input[type=url],select,button{box-sizing:border-box;width:100%;padding:10px;border-radius:8px;border:1px solid #465575}input,select{background:#202f4a;color:white}button{background:#8faeff;color:#0b1730;font-weight:700;cursor:pointer}.choices{display:flex;gap:8px}.choices label{flex:1}#status{white-space:pre-wrap;margin-top:12px}</style><h1>MiCirql Export</h1><p>Local full-page screenshots. No rendering server.</p><form id="capture"><label>Website URL<input id="url" type="url" required placeholder="https://example.com"></label><button id="discover" type="button">Discover pages linked from homepage</button><label><input id="excludeAccount" type="checkbox" checked> Exclude common login and account pages during discovery</label><div id="pages" style="max-height:180px;overflow:auto;margin:10px 0"></div><div class="choices"><label><input type="checkbox" name="width" value="375" checked> Mobile</label><label><input type="checkbox" name="width" value="768" checked> Tablet</label><label><input type="checkbox" name="width" value="1440" checked> Desktop</label></div><label>Format<select id="format"><option value="jpeg">JPG</option><option value="png">PNG</option></select></label><button id="go">Capture & download one ZIP</button></form><label for="progress">Capture progress <output id="percent">0%</output></label><progress id="progress" max="100" value="0" style="width:100%;height:16px;accent-color:#8faeff"></progress><p id="status" role="status"></p><script src="popup.js"></script></html>
