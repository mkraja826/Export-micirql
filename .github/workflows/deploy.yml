name: Deploy MiCirql Tools to Cloudflare
on:
  workflow_dispatch:
  push:
    branches: [main]
concurrency:
  group: micirql-tools-production
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run complete unit and API integration tests
        run: |
          echo 'Starting bounded deployment test suite'
          timeout --signal=TERM --kill-after=30s 8m npm test
      - name: Package downloadable Chrome extension
        run: |
          mkdir -p public/extension
          cd extension
          zip -q -r ../public/extension/micirql-tools-extension.zip manifest.json background.js bridge.js offscreen.html popup.html popup.js zip.js
          cd ..
          unzip -t public/extension/micirql-tools-extension.zip
          node scripts/verify-extension-package.mjs public/extension/micirql-tools-extension.zip
      - name: Validate Worker
        run: |
          node --check src/worker.js
          npx wrangler deploy --dry-run --outdir dist-worker
      - name: Deploy Worker and assets
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify tools domain and legacy redirects
        run: node scripts/smoke-test.mjs
