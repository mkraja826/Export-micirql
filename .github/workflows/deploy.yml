name: Deploy MiCirql Tools to Cloudflare
on:
  workflow_dispatch:
  push:
    branches: [main]
concurrency:
  group: micirql-tools-production
  cancel-in-progress: false
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run complete unit and API integration tests
        run: npm test
      - name: Validate Worker
        run: |
          node --check src/worker.js
          npx wrangler deploy --dry-run --outdir dist-worker
      - name: Deploy Worker and assets
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify tools domain and legacy redirects
        run: node scripts/smoke-test.mjs
