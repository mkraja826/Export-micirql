name: Unified Website Health Real-Site Evidence
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'public/tools/health/**'
      - 'extension/**'
      - 'scripts/unified-health-live-extension-smoke.mjs'
      - '.github/workflows/unified-health-evidence.yml'
permissions:
  contents: read
jobs:
  real-chrome:
    name: Public-site extension-to-PDF smoke (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium and PDF test dependencies
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npx playwright install --with-deps chromium
          sudo apt-get install -y -qq poppler-utils
      - name: Inspect real public demo pages with the actual Chrome extension
        continue-on-error: true
        timeout-minutes: 6
        run: node scripts/unified-health-live-extension-smoke.mjs --strict
      - name: Upload real browser findings and combined PDF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unified-health-live-evidence
          path: |
            dist/unified-health-live-evidence/live-evidence.json
            dist/unified-health-live-evidence/*.pdf
          if-no-files-found: warn
          retention-days: 14
