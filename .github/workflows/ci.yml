name: Validate MiCirql Export
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check Node and Worker syntax
        run: |
          node --check server.js
          node --check src/worker.js
      - name: Test MCP protocol and authorization
        run: node --test tests/mcp.test.mjs
      - name: Run complete regression suite (including 60-page SEO stress tests)
        run: timeout --signal=TERM --kill-after=30s 8m npm test
      - name: Validate Cloudflare deployment configuration
        run: npx wrangler deploy --dry-run --outdir dist-worker
