name: Verify MiCirql Tools
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run unit and Worker integration tests
        run: npm test
      - name: Validate Worker JavaScript syntax
        run: node --check src/worker.js
      - name: Validate SEO inspector syntax
        run: node --check src/seo-inspector.js
      - name: Validate request limit syntax
        run: node --check src/request-limits.js
