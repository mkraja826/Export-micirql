name: Verify MiCirql Tools
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run unit and Worker integration tests
        run: npm test
      - name: Validate Worker JavaScript syntax
        run: node --check src/worker.js
      - name: Validate SEO inspector syntax
        run: node --check src/seo-inspector.js
      - name: Validate request limit syntax
        run: node --check src/request-limits.js
      - name: Validate SEO browser and extension scripts
        run: |
          node --check public/tools/seo/inspector.js
          node --check extension/background.js
          node --check extension/bridge.js
      - name: Validate browser extension manifest
        run: node -e "const fs=require('node:fs'); const m=JSON.parse(fs.readFileSync('extension/manifest.json','utf8')); if(m.manifest_version!==3)process.exit(1)"
