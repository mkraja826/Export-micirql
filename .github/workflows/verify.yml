name: Verify MiCirql Tools
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run unit and Worker integration tests
        run: npm test
      - name: Install browser QA dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Test SEO Studio mobile viewports
        run: node scripts/seo-mobile-qa.mjs
      - name: Validate Worker JavaScript syntax
        run: node --check src/worker.js
      - name: Validate SEO inspector syntax
        run: node --check src/seo-inspector.js
      - name: Validate request limit syntax
        run: node --check src/request-limits.js
      - name: Validate SEO browser and extension scripts
        run: |
          node --check public/tools/seo/inspector.js
          node --check public/tools/screenshots/studio.js
          node --check extension/background.js
          node --check extension/bridge.js
          node --check extension/popup.js
          node --check extension/zip.js
      - name: Validate extension release assets
        run: node scripts/validate-extension.mjs
      - name: Build installable extension ZIP
        run: |
          mkdir -p dist
          cd extension
          zip -q ../dist/micirql-tools-extension.zip manifest.json background.js bridge.js popup.html popup.js offscreen.html zip.js
      - name: Verify generated ZIP archive
        run: |
          unzip -t dist/micirql-tools-extension.zip
          test "$(unzip -Z -1 dist/micirql-tools-extension.zip | wc -l)" -eq 7
          unzip -Z -1 dist/micirql-tools-extension.zip | grep -Fx 'manifest.json'
          unzip -Z -1 dist/micirql-tools-extension.zip | grep -Fx 'background.js'
      - name: Upload verified extension package
        uses: actions/upload-artifact@v4
        with:
          name: micirql-tools-extension
          path: dist/micirql-tools-extension.zip
          if-no-files-found: error
          retention-days: 30
