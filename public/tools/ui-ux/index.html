<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>UI/UX Inspector | MiCirql Tools</title><style>:root{font-family:system-ui;color-scheme:dark}*{box-sizing:border-box}body{background:#090f1e;color:#f4f7ff;margin:0;line-height:1.5}.wrap{max-width:980px;margin:auto;padding:24px}nav{display:flex;flex-wrap:wrap;gap:18px;border-bottom:1px solid #344967;padding-bottom:20px}a{color:#b6ccff}h1{font-size:clamp(30px,5vw,48px)}p{color:#b9c7df}label{display:block;margin:18px 0 8px;font-weight:700}input,textarea,button{font:inherit;border-radius:10px}input,textarea{width:100%;background:#15233a;border:1px solid #4b6184;color:#fff;padding:13px}textarea{min-height:240px;resize:vertical;font-family:monospace;font-size:13px}button{background:#b4caff;color:#101a2b;padding:12px 18px;border:0;font-weight:750;cursor:pointer}button:disabled{opacity:.5}button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid #a4bfff;outline-offset:3px}.panel{background:#142139;border:1px solid #334b6e;padding:22px;border-radius:15px;margin-top:22px}.finding{border-left:3px solid #e2b69a;background:#1b2a43;padding:11px 15px;margin:10px 0}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}</style></head><body><div class="wrap"><nav aria-label="Tool navigation"><a href="/tools/">← All tools</a><a href="/tools/screenshots/">Screenshots</a><a href="/tools/seo/">SEO</a><a href="/tools/qa/">QA</a><a href="/tools/ui-ux/" aria-current="page">UI/UX</a></nav><main><h1>UI/UX Inspector <small>(Beta)</small></h1><p>Inspect HTML source for responsive viewport configuration, zoom restrictions, structural landmarks and possible typography issues. This is not a visual design rating or screenshot analysis.</p><form id="audit"><label for="url">Website URL</label><input id="url" type="url" maxlength="2048" required placeholder="https://example.com/"><label for="html">HTML source</label><textarea id="html" required maxlength="1000000" placeholder="Paste HTML here"></textarea><div class="actions"><button type="submit" id="run">Inspect UI/UX</button><button type="button" id="local">Capture HTML with extension</button></div></form><section class="panel" id="output" hidden aria-live="polite"></section><div class="actions"><button type="button" id="download" disabled>Download JSON report</button></div></main></div><script>const url=document.getElementById('url'),form=document.getElementById('audit'),output=document.getElementById('output'),run=document.getElementById('run'),download=document.getElementById('download'),local=document.getElementById('local');try{const u=new URL(new URLSearchParams(location.search).get('url'));if(['http:','https:'].includes(u.protocol)&&!u.username&&!u.password)url.value=u.href}catch{}let report=null;form.addEventListener('submit',async e=>{e.preventDefault();run.disabled=true;download.disabled=true;report=null;output.hidden=false;output.replaceChildren();try{const response=await fetch('/api/ui/html',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({url:url.value,html:document.getElementById('html').value})});const data=await response.json();if(!response.ok)throw Error(data.error||'Inspection failed');report={schemaVersion:1,tool:'ui-ux',generatedAt:new Date().toISOString(),...data};const heading=document.createElement('h2');heading.textContent='Source-level UI findings ('+data.findings.length+')';output.append(heading);if(!data.findings.length){const p=document.createElement('p');p.textContent='No issues detected by these limited source-level checks.';output.append(p)}for(const item of data.findings){const p=document.createElement('div');p.className='finding';p.textContent=item.severity.toUpperCase()+' · '+item.message;output.append(p)}download.disabled=false}catch(err){output.textContent=err.message}finally{run.disabled=false}});local.addEventListener('click',()=>{if(!url.value||!url.checkValidity()){output.hidden=false;output.textContent='Enter a valid website URL.';return}const id=String(Date.now())+'-'+Math.random().toString(36).slice(2);local.disabled=true;const timer=setTimeout(()=>{window.removeEventListener('message',handler);local.disabled=false;output.hidden=false;output.textContent='Extension did not respond.'},60000);function handler(e){if(e.source!==window||e.origin!==location.origin||e.data?.source!=='micirql-extension'||e.data?.type!=='MICIRQL_SEO_RESULT'||e.data.id!==id)return;clearTimeout(timer);window.removeEventListener('message',handler);local.disabled=false;if(!e.data.ok){output.hidden=false;output.textContent=e.data.error||'Capture failed';return}document.getElementById('html').value=e.data.html||'';form.requestSubmit()}window.addEventListener('message',handler);window.postMessage({source:'micirql-web',type:'MICIRQL_SEO_READ',id,url:url.value},location.origin)});download.addEventListener('click',()=>{if(!report)return;const blob=new Blob([JSON.stringify(report,null,2)],{type:'application/json'}),objectUrl=URL.createObjectURL(blob),a=document.createElement('a');a.href=objectUrl;a.download='micirql-ui-report.json';a.click();setTimeout(()=>URL.revokeObjectURL(objectUrl),1000)});</script></body></html>
