<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>SEO HTML Inspector | MiCirql Tools</title><style>
:root{color-scheme:dark;font-family:system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:#090f1e;color:#f5f7ff;line-height:1.5}.wrap{max-width:980px;margin:auto;padding:24px}a{color:#a8c4ff}h1{font-size:clamp(30px,5vw,48px);letter-spacing:-.04em}p,.hint{color:#b4c2db}label{display:block;font-weight:700;margin:18px 0 7px}input,textarea,button{font:inherit;border-radius:10px}input,textarea{width:100%;background:#15233a;border:1px solid #415575;color:#fff;padding:13px}textarea{min-height:250px;resize:vertical;font-family:ui-monospace,monospace;font-size:13px}button{background:#9eb7ff;color:#07101e;padding:13px 20px;border:0;font-weight:750;cursor:pointer}button:disabled{opacity:.5}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #b8caff;outline-offset:3px}.panel{background:#142139;border:1px solid #2d4163;border-radius:16px;padding:22px;margin:22px 0}.finding{border-left:3px solid #d8a1a1;padding:9px 15px;background:#1b2a43;margin:10px 0}.small{font-size:13px}.error{color:#ffb8bf}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}footer{padding:30px 0;color:#a7b8d4}
</style></head><body><div class="wrap"><nav><a href="/tools/">← MiCirql Tools</a></nav><main><h1>SEO HTML Inspector</h1><p>Analyze HTML source for essential SEO signals. This beta does not fetch websites or evaluate JavaScript-rendered content.</p><form id="audit"><label for="url">Page URL (for report reference)</label><input id="url" type="url" required placeholder="https://example.com/" maxlength="2048"><label for="html">HTML source</label><textarea id="html" required maxlength="1000000" placeholder="Paste the HTML source here"></textarea><p class="small hint">Maximum 1 MB of HTML. Do not paste passwords, private tokens, or sensitive information.</p><button id="run" type="submit">Analyze HTML</button> <button id="local" type="button">Capture HTML with Chrome extension</button></form><section id="output" class="panel" hidden aria-live="polite"></section></main><footer>MiCirql Tools · Static HTML inspection beta</footer></div><script>
const form=document.getElementById('audit'),out=document.getElementById('output'),btn=document.getElementById('run');
function line(label,value){const p=document.createElement('p');const b=document.createElement('strong');b.textContent=label+': ';p.append(b,document.createTextNode(String(value||'Not present')));return p}
const local=document.getElementById('local');
local.addEventListener('click',()=>{
 const url=document.getElementById('url').value;
 if(!url){out.hidden=false;out.textContent='Enter a website URL first.';return}
 const id=String(Date.now())+'-'+Math.random().toString(36).slice(2);
 local.disabled=true;local.textContent='Capturing…';
 const timer=setTimeout(()=>{window.removeEventListener('message',onResult);local.disabled=false;local.textContent='Capture HTML with Chrome extension';out.hidden=false;out.textContent='Extension did not respond. Install or reload MiCirql Tools extension.'},60000);
 function onResult(event){
  if(event.source!==window||event.origin!==location.origin||event.data?.source!=='micirql-extension'||event.data?.type!=='MICIRQL_SEO_RESULT'||event.data.id!==id)return;
  clearTimeout(timer);window.removeEventListener('message',onResult);local.disabled=false;local.textContent='Capture HTML with Chrome extension';
  if(!event.data.ok){out.hidden=false;out.textContent=event.data.error||'Local capture failed';return}
  document.getElementById('html').value=event.data.html||'';
  form.requestSubmit();
 }
 window.addEventListener('message',onResult);
 window.postMessage({source:'micirql-web',type:'MICIRQL_SEO_READ',id,url},location.origin);
});
form.addEventListener('submit',async event=>{
 event.preventDefault();out.hidden=false;out.replaceChildren();btn.disabled=true;btn.textContent='Analyzing…';
 try{
  const response=await fetch('/api/seo/html',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({url:document.getElementById('url').value,html:document.getElementById('html').value})});
  const data=await response.json();if(!response.ok)throw Error(data.error||'Analysis failed');
  const h=document.createElement('h2');h.textContent='SEO findings';out.append(h);
  for(const [label,key] of [['Title','title'],['Description','description'],['Canonical','canonical'],['Language','lang'],['Robots','robots'],['H1 count','h1Count']])out.append(line(label,data[key]));
  if(!data.findings.length){const p=document.createElement('p');p.textContent='No issues found by the basic static HTML checks.';out.append(p)}
  for(const item of data.findings){const p=document.createElement('div');p.className='finding';p.textContent=item.severity.toUpperCase()+' · '+item.message;out.append(p)}
 }catch(e){const p=document.createElement('p');p.className='error';p.textContent=e.message;out.append(p)}
 finally{btn.disabled=false;btn.textContent='Analyze HTML'}
});
</script></body></html>
