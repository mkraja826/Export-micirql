<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Export Micirql</title><style>body{font-family:system-ui;background:#0b1020;color:white;max-width:900px;margin:5vh auto;padding:24px}input,select,button{padding:12px;border-radius:8px}input[type=url]{width:min(90%,550px)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:20px 0}.tile{background:#1b2540;padding:15px;border-radius:12px}img{max-width:100%;max-height:400px;object-fit:contain;object-position:top}button{background:#92aaff;cursor:pointer}a{color:#aabfff}</style><h1>Export Micirql</h1><p>Full-page responsive website screenshots, powered by Cloudflare.</p><form id="f"><input id="url" type="url" required value="https://example.com"><select id="format"><option value="jpg">JPG</option><option value="png">PNG</option></select><div class="grid" id="presets"></div><button id="go">Capture selected screens</button></form><p id="status" role="status"></p><div class="grid" id="results"></div><script>
const presets=[320,375,430,768,1024,1440,1920,3840];
document.querySelector('#presets').innerHTML=presets.map(w=>'<label class="tile"><input type="checkbox" checked value="'+w+'"> '+w+' px</label>').join('');
document.querySelector('#f').onsubmit=async e=>{e.preventDefault();const btn=document.querySelector('#go'),status=document.querySelector('#status'),results=document.querySelector('#results');btn.disabled=true;results.replaceChildren();const widths=[...document.querySelectorAll('input[type=checkbox]:checked')].map(x=>+x.value);const format=document.querySelector('#format').value;const url=document.querySelector('#url').value;try{for(const width of widths){status.textContent='Capturing '+width+' px…';const r=await fetch('/api/screenshot',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({url,width,format})});if(!r.ok){const d=await r.json();throw Error(width+'px: '+d.error)}const blob=await r.blob(),object=URL.createObjectURL(blob),card=document.createElement('div');card.className='tile';const title=document.createElement('h3');title.textContent=width+' px';const img=document.createElement('img');img.src=object;img.alt=width+' px screenshot';const a=document.createElement('a');a.href=object;a.download='export-micirql-'+width+'px.'+format;a.textContent='Download';card.append(title,img,a);results.append(card)}status.textContent='Finished '+widths.length+' captures.'}catch(err){status.textContent=err.message}finally{btn.disabled=false}};
</script></html>
