<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Website Screenshot Tool | MiCirql</title><style>body{font-family:system-ui;background:#0b1020;color:white;max-width:900px;margin:5vh auto;padding:24px}input,select,button{padding:12px;border-radius:8px}input[type=url]{width:min(90%,550px)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:20px 0}.tile{background:#1b2540;padding:15px;border-radius:12px}img{display:block;width:100%;height:auto}.shot{height:520px;overflow:auto;background:#fff;border:1px solid #394968;border-radius:8px}.shot img{max-width:none}.tile{min-width:0}.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}.tools button{padding:7px 10px}.tile h3{margin:0 0 8px}.hint{color:#a8b5d2;font-size:12px}button{background:#92aaff;cursor:pointer}a{color:#aabfff}</style><header style="display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap"><div><strong style="font-size:25px;letter-spacing:-1px">MiCirql<span style="color:#92aaff">.</span></strong><div style="font-size:12px;color:#a8b5d2">WEBSITE TOOLS</div></div><a href="https://micirql.com" style="font-size:14px">MiCirql Home ↗</a></header><h1>Website Screenshot Tool</h1><p>Preview and export websites across mobile, tablet and desktop screen sizes. A tool by MiCirql.</p><form id="f"><input id="url" type="url" required value="https://example.com"><select id="format"><option value="jpg">JPG</option><option value="png">PNG</option></select><div class="grid" id="presets"></div><button id="go">Capture selected screens</button></form><p id="status" role="status"></p><div class="grid" id="results"></div><script>
const presets=[320,375,430,768,1024,1440,1920,3840];
document.querySelector('#presets').innerHTML=presets.map(w=>'<label class="tile"><input type="checkbox" checked value="'+w+'"> '+w+' px</label>').join('');
document.querySelector('#f').onsubmit=async e=>{e.preventDefault();const btn=document.querySelector('#go'),status=document.querySelector('#status'),results=document.querySelector('#results');btn.disabled=true;results.replaceChildren();const widths=[...document.querySelectorAll('input[type=checkbox]:checked')].map(x=>+x.value);const format=document.querySelector('#format').value;const url=document.querySelector('#url').value;try{for(const width of widths){status.textContent='Capturing '+width+' px…';const r=await fetch('/api/screenshot',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({url,width,format})});if(!r.ok){const d=await r.json();throw Error(width+'px: '+d.error)}const blob=await r.blob(),object=URL.createObjectURL(blob),card=document.createElement('div');card.className='tile';const title=document.createElement('h3');title.textContent=width+' px';const img=document.createElement('img');img.src=object;img.alt=width+' px screenshot';const a=document.createElement('a');a.href=object;a.download='export-micirql-'+width+'px.'+format;a.textContent='Download';const tools=document.createElement('div');tools.className='tools';const zoom=document.createElement('input');zoom.type='range';zoom.min='20';zoom.max='200';zoom.value='100';zoom.setAttribute('aria-label','Preview zoom');const percent=document.createElement('span');percent.textContent='100%';const shot=document.createElement('div');shot.className='shot';const actual=document.createElement('button');actual.type='button';actual.textContent='1:1';actual.onclick=()=>{zoom.value='100';zoom.oninput()};zoom.oninput=()=>{img.style.width=(width*Number(zoom.value)/100)+'px';percent.textContent=zoom.value+'%'};img.style.width=width+'px';shot.append(img);tools.append(actual,zoom,percent);const hint=document.createElement('p');hint.className='hint';hint.textContent='Scroll inside the preview. Download preserves original capture pixels.';card.append(title,tools,shot,hint,a);results.append(card)}status.textContent='Finished '+widths.length+' captures.'}catch(err){status.textContent=err.message}finally{btn.disabled=false}};
</script><footer style="margin-top:48px;border-top:1px solid #34405a;padding-top:20px;color:#a8b5d2;font-size:13px">© MiCirql · Website Screenshot Tool · <a href="https://micirql.com">micirql.com</a></footer></html>
